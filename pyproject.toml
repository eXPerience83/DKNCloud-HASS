# Development/test tooling. The integration runtime remains governed by
# custom_components/airzoneclouddaikin/manifest.json and HACS metadata.
# The locked HA harness uses the supported Python 3.14 line; compatibility
# testing for additional HA/Python combinations is tracked in #109.
[project]
name = "dkncloud-hass"
version = "0.5.0a2"
requires-python = ">=3.14"

[dependency-groups]
lint = [
    "ruff==0.17.3",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    # Keep pytest-asyncio aligned with the official Home Assistant test harness.
    "aiointercept==1.0.0",
    "pytest-homeassistant==2026.11.0",
    "homeassistant==2026.11.0",
]
release = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
required-version = "==0.13.6"
default-groups = []
# Avoid adopting newly published transitive dependencies immediately.
exclude-newer = "3 days"
# The HA/first-party pytest pair is explicitly pinned and reviewed together.
# Baseline updater and Renovate retain the 3-day promotion maturity gate.
exclude-newer-package = { homeassistant = false, pytest-homeassistant = false }
# The baseline harness targets Python 3.14.10; don't accidentally resolve
# against 3.15 when HA/first-party pytest harness have a different supported interpreter range.
environments = ["python_full_version >= '3.14.2' and python_full_version < '3.15'"]

[tool.ruff]
line-length = 88
target-version = "py314"
preview = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
preview = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E203",
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.airzoneclouddaikin"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
