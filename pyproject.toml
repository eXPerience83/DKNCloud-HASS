# Development/test tooling. The integration runtime remains governed by
# custom_components/airzoneclouddaikin/manifest.json and HACS metadata.
# The locked HA harness uses the supported Python 3.14 line; compatibility
# testing for additional HA/Python combinations is tracked in #109.
[project]
name = "dkncloud-hass"
version = "0.5.0a2"
requires-python = ">=3.14"

[dependency-groups]
lint = [
    "black==26.10.1",
    "ruff==0.17.3",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    # pytest-asyncio is an exact transitive dependency of the pinned PHACC.
    # Do not update it independently: PHACC owns the compatible version.
    "aiointercept==1.0.0",
    "pytest-homeassistant-custom-component==0.13.375",
    "homeassistant==2026.10.4",
]
release = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
required-version = "==0.13.6"
default-groups = []
# Avoid adopting newly published transitive dependencies immediately.
exclude-newer = "3 days"
# The baseline harness targets Python 3.14.7; don't accidentally resolve
# against 3.15 when HA/PHACC have a different supported interpreter range.
environments = ["python_full_version >= '3.14.2' and python_full_version < '3.15'"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E203",
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.airzoneclouddaikin"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
