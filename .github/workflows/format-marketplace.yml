name: Temporary Marketplace validator formatter

# ONE-TIME branch-specific formatting workflow, remove before PR merge.
on:
  push:
    branches: [ci/marketplace-2026-11-readiness]
    paths:
      - .github/workflows/format-marketplace.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'eXPerience83/DKNCloud-HASS'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group lint
          uv run --locked --no-sync black scripts/validate_marketplace_release.py tests/test_marketplace_release.py
          uv run --locked --no-sync ruff check scripts/validate_marketplace_release.py tests/test_marketplace_release.py
          git add scripts/validate_marketplace_release.py tests/test_marketplace_release.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: apply pinned Black to Marketplace validators'
            git push origin HEAD:ci/marketplace-2026-11-readiness
          fi
