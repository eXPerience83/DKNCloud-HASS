name: Minimum Home Assistant Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimum-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            .github/requirements/minimum-ha.in
            .github/requirements/minimum-ha.txt
          cache-suffix: minimum-ha

      - name: Verify declared minimum and exact harness pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          minimum = json.loads(Path("hacs.json").read_text(encoding="utf-8"))["homeassistant"]
          requirements = {}
          for text in Path(".github/requirements/minimum-ha.in").read_text(encoding="utf-8").splitlines():
              text = text.strip()
              if not text or text.startswith("#"):
                  continue
              name, sep, version = text.partition("==")
              if not sep or not name or not version or name in requirements:
                  raise SystemExit(f"Invalid or duplicate exact pin: {text!r}")
              requirements[name] = version
          expected = {"homeassistant", "pytest-homeassistant-custom-component", "packaging"}
          if requirements.keys() != expected:
              raise SystemExit(f"Expected exactly {sorted(expected)}; found {sorted(requirements)}")
          if requirements["homeassistant"] != minimum:
              raise SystemExit(f"Minimum-HA pin {requirements['homeassistant']} != hacs.json {minimum}")
          print(f"Declared and pinned minimum Home Assistant: {minimum}")
          PY

      - name: Install isolated, hash-verified minimum HA test environment
        shell: bash
        run: |
          set -euo pipefail
          minimum_venv="$RUNNER_TEMP/ha-minimum-compatibility-venv"
          uv venv --python "$(command -v python)" "$minimum_venv"
          uv pip sync --python "$minimum_venv/bin/python" --require-hashes \
            .github/requirements/minimum-ha.txt
          printf 'MINIMUM_PYTHON=%s\n' "$minimum_venv/bin/python" >> "$GITHUB_ENV"

      - name: Verify resolved version pair and publish summary
        shell: bash
        run: |
          set -euo pipefail
          "$MINIMUM_PYTHON" - <<'PY'
          import importlib.metadata as meta
          import os
          import subprocess
          from pathlib import Path

          from packaging.requirements import Requirement

          pins = {}
          for line in Path(".github/requirements/minimum-ha.in").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  name, version = line.split("==", 1)
                  pins[name] = version
          for name, version in pins.items():
              actual = meta.version(name)
              if actual != version:
                  raise SystemExit(f"{name} installed {actual}, expected {version}")
          required_ha = [
              req for req in meta.requires("pytest-homeassistant-custom-component")
              if Requirement(req).name == "homeassistant"
          ]
          if len(required_ha) != 1 or str(Requirement(required_ha[0]).specifier) != f"=={pins['homeassistant']}":
              raise SystemExit(f"PHACC must require exactly HA=={pins['homeassistant']}; got {required_ha}")
          rows = [
              "## Minimum Home Assistant compatibility (required)",
              "",
              f"- Python: `{subprocess.check_output([os.environ['MINIMUM_PYTHON'], '--version'], text=True).strip()}`",
          ]
          for name in (*sorted(pins), "pytest", "pytest-asyncio"):
              rows.append(f"- {name}: `{meta.version(name)}`")
          rows.append(f"- uv: `{subprocess.check_output(['uv', '--version'], text=True).strip()}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(rows) + "\n")
          print("\n".join(rows))
          PY

      - name: Run complete test suite against minimum HA
        shell: bash
        env:
          HA_MINIMUM_COMPATIBILITY: "1"
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          "$MINIMUM_PYTHON" -m pytest -q -ra -p no:cacheprovider
