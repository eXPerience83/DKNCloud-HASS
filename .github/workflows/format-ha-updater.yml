name: Temporary Phase 4 formatter

# Temporary, branch-specific formatter; removed before PR merge.
on:
  push:
    branches: [ci/109-review-only-ha-baseline-updater]
    paths:
      - .github/workflows/format-ha-updater.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'eXPerience83/DKNCloud-HASS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Format and inspect all new Python files
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group release
          uv run --locked --no-sync black scripts/ha_test_baseline_updater.py \
            tests/test_ha_test_baseline_updater.py \
            tests/test_ha_test_baseline_updater_publication.py \
            tests/test_ha_test_baseline_updater_transitive.py \
            tests/test_ha_test_baseline_updater_workflow.py
          uv run --locked --no-sync ruff check .
          git add scripts/ha_test_baseline_updater.py \
            tests/test_ha_test_baseline_updater.py \
            tests/test_ha_test_baseline_updater_publication.py \
            tests/test_ha_test_baseline_updater_transitive.py \
            tests/test_ha_test_baseline_updater_workflow.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: format HA baseline updater and safety regression tests'
            git push origin HEAD:ci/109-review-only-ha-baseline-updater
          fi
