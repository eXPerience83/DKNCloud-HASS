name: Temporary Phase 5 coverage bootstrap

# One-time, branch-only. Remove immediately after validated lockfile update.
on:
  push:
    branches: [test/109-phase5-dkn-lifecycle-coverage]
    paths:
      - .github/workflows/bootstrap-coverage.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'eXPerience83/DKNCloud-HASS'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Resolve reproducible pytest-cov dependency and measure original baseline
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv lock --check
          uv sync --locked --only-group test
          PYTHONPATH=. uv run --locked --no-sync python -m pytest -q \
            --cov=custom_components.airzoneclouddaikin \
            --cov-report=term-missing \
            --cov-report=json:coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("coverage.json").read_text())
          summary = ["## Phase 5: statement coverage baseline", "",
                     f"Total: {data['totals']['percent_covered']:.2f}%", "",
                     "| Module | Statements | Missing | Coverage |", "|---|---:|---:|---:|"]
          for name, obj in sorted(data["files"].items()):
              result = obj["summary"]
              summary.append(
                  f"| {name.split('/')[-1]} | {result['num_statements']} | "
                  f"{result['missing_lines']} | {result['percent_covered']:.2f}% |"
              )
          print("\n".join(summary))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n".join(summary) + "\n")
          PY
          git add uv.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'test: lock pytest-cov for measurable DKN coverage'
            git push origin HEAD:test/109-phase5-dkn-lifecycle-coverage
          fi
