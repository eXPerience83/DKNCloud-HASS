name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit to lint (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock

      - name: Verify locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group release

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PY'
          import importlib.metadata as m
          import sys
          print("Python:", sys.version)
          for name in ("homeassistant", "pytest-homeassistant-custom-component", "pytest", "pytest-asyncio", "black", "ruff"):
              print(f"{name}: {m.version(name)}")
          PY
          uv --version

      - name: Ruff (check only)
        run: uv run --locked --no-sync ruff check .

      - name: Black (check only)
        run: uv run --locked --no-sync black --check .
