name: Temporary HA updater realistic promotion simulation

# Delete after CI validation; never merges or publishes.
on:
  push:
    branches: [ci/109-review-only-ha-baseline-updater]
    paths:
      - .github/workflows/simulate-ha-baseline.yml

permissions:
  contents: read

jobs:
  simulate:
    if: github.repository == 'eXPerience83/DKNCloud-HASS'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Simulate the mature 2026.10.3 to 2026.10.4 promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("pyproject.toml")
          text = source.read_text(encoding="utf-8")
          assert text.count('"homeassistant==2026.10.4"') == 1
          assert text.count('"pytest-homeassistant-custom-component==0.13.375"') == 1
          text = text.replace(
              '"homeassistant==2026.10.4"', '"homeassistant==2026.10.3"'
          ).replace(
              '"pytest-homeassistant-custom-component==0.13.375"',
              '"pytest-homeassistant-custom-component==0.13.374"',
          )
          source.write_text(text, encoding="utf-8")
          PY
          uv lock --upgrade-package homeassistant \
            --upgrade-package pytest-homeassistant-custom-component
          uv lock --check
          cp uv.lock "$RUNNER_TEMP/uv.lock.older"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/updater-planner"
          uv pip install --python "$RUNNER_TEMP/updater-planner/bin/python" packaging==26.3
          "$RUNNER_TEMP/updater-planner/bin/python" \
            scripts/ha_test_baseline_updater.py plan > "$RUNNER_TEMP/plan.json"
          jq -e '.status == "update" and .selected_homeassistant == "2026.10.4" and .selected_phacc == "0.13.375" and .cooldown_days == 3' "$RUNNER_TEMP/plan.json"
          "$RUNNER_TEMP/updater-planner/bin/python" \
            scripts/ha_test_baseline_updater.py update-pyproject --plan "$RUNNER_TEMP/plan.json"
          uv lock --upgrade-package homeassistant \
            --upgrade-package pytest-homeassistant-custom-component
          "$RUNNER_TEMP/updater-planner/bin/python" \
            scripts/ha_test_baseline_updater.py validate-lock \
              --before "$RUNNER_TEMP/uv.lock.older" --after uv.lock \
              --homeassistant 2026.10.4 --phacc 0.13.375
          uv lock --check
          uv sync --locked --only-group release
          PYTHONPATH=. uv run --locked --no-sync python -m pytest -q
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync black --check .
          jq -r '"Simulation passed: HA " + .current_homeassistant + " -> " + .selected_homeassistant + ", PHACC " + .current_phacc + " -> " + .selected_phacc' "$RUNNER_TEMP/plan.json"
