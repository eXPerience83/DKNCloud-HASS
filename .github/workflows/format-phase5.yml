name: Temporary Phase 5 formatter

# One-off workflow, removed after formatting and tests.
on:
  push:
    branches: [test/109-phase5-dkn-lifecycle-coverage]
    paths:
      - .github/workflows/format-phase5.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'eXPerience83/DKNCloud-HASS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Format and inspect changed DKN test files
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group release
          changed=(
            scripts/check_coverage.py
            tests/test_coverage_gate.py
            tests/test_climate_write_contract.py
            tests/test_coordinator_lifecycle_contract.py
            tests/test_airzone_api.py
            tests/test_notifications.py
          )
          uv run --locked --no-sync ruff check --fix "${changed[@]}"
          uv run --locked --no-sync black "${changed[@]}"
          uv run --locked --no-sync ruff check .
          git add "${changed[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: format phase 5 DKN coverage and regression tests'
            git push origin HEAD:test/109-phase5-dkn-lifecycle-coverage
          fi
