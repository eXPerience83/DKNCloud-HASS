name: Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock

      - name: Verify locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group release

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PY'
          import importlib.metadata as m
          import sys
          print("Python:", sys.version)
          for name in ("homeassistant", "pytest-homeassistant-custom-component", "pytest", "pytest-asyncio", "black", "ruff"):
              print(f"{name}: {m.version(name)}")
          PY
          uv --version

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m compileall -q custom_components tests

      - name: Ruff validation
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync ruff check .

      - name: Black validation
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync black --check .

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m pytest -q
        env:
          PYTHONPATH: .

      - name: Build release ZIP (integration root at ZIP root)
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${{ github.workspace }}/airzoneclouddaikin.zip"
          git archive --format=zip --output="${{ github.workspace }}/airzoneclouddaikin.zip" HEAD:custom_components/airzoneclouddaikin

      - name: Validate installable Marketplace / HACS release asset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_marketplace_release.py airzoneclouddaikin.zip --expected-release-tag "${{ github.event.release.tag_name }}"

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          files: airzoneclouddaikin.zip
          overwrite_files: true
          fail_on_unmatched_files: true
