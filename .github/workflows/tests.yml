name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock

      - name: Check minimum HA matches locked test baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          minimum = json.loads(Path("hacs.json").read_text(encoding="utf-8"))["homeassistant"]
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          ha_specs = [
              spec.removeprefix("homeassistant==")
              for spec in project["dependency-groups"]["test"]
              if isinstance(spec, str) and spec.startswith("homeassistant==")
          ]
          if len(ha_specs) != 1:
              raise SystemExit("Expected exactly one pinned homeassistant test dependency")
          if minimum != ha_specs[0]:
              raise SystemExit(
                  f"Supported HA minimum {minimum} differs from locked test HA {ha_specs[0]}. "
                  "Restore a separate pinned minimum-HA harness and update this guard before advancing the baseline, "
                  "or explicitly review and document a support-floor increase."
              )
          print(f"Verified supported HA minimum and test baseline: {minimum}")
          PY

      - name: Verify locked test environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group test

      - name: Report resolved HA test baseline
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PY'
          import importlib.metadata as m
          import sys
          import os
          rows = ["## Locked Home Assistant test baseline", "", f"- Python: `{sys.version.split()[0]}`"]
          for name in ("homeassistant", "pytest-homeassistant-custom-component", "pytest", "pytest-asyncio", "aiointercept"):
              rows.append(f"- {name}: `{m.version(name)}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(rows) + "\n")
          PY
          uv --version

      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m pytest -q \
            --cov=custom_components.airzoneclouddaikin \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Report and check incremental statement coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python scripts/check_coverage.py \
            coverage.json --min-total 74.0 \
            --module-min __init__.py=73.0 \
            --module-min airzone_api.py=75.0 \
            --module-min climate.py=65.0

      - name: Upload per-module coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dkn-statement-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
