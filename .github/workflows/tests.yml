name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock

      - name: Check HA minimum and first-party harness policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ha_minimum_policy.py \
            --github-output "$RUNNER_TEMP/ha-minimum-policy.out"

      - name: Validate artifact-bounded cooldown policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ha_pair_cooldown.py check

      - name: Verify locked test environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group test
          uv pip check --python .venv/bin/python

      - name: Compile Python integration and test sources
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m compileall -q custom_components tests scripts

      - name: Report resolved HA test baseline
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PY'
          import importlib.metadata as m
          import sys
          import os
          rows = ["## Locked Home Assistant test baseline", "", f"- Python: `{sys.version.split()[0]}`"]
          for name in ("homeassistant", "pytest-homeassistant", "pytest", "pytest-asyncio", "aiointercept"):
              rows.append(f"- {name}: `{m.version(name)}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(rows) + "\n")
          PY
          uv --version

      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m pytest -q \
            --cov=custom_components.airzoneclouddaikin \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Run independent Home Assistant loopback smoke
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python scripts/run_isolated_ha.py

      - name: Report and check incremental statement coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python scripts/check_coverage.py \
            coverage.json --min-total 74.0 \
            --module-min __init__.py=73.0 \
            --module-min airzone_api.py=75.0 \
            --module-min climate.py=65.0

      - name: Verify combined locked release dependency group
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --only-group release
          uv pip check --python .venv/bin/python

      - name: Upload per-module coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dkn-statement-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
