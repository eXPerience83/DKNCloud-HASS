name: Package Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock

      - name: Verify locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group release

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PY'
          import importlib.metadata as m
          import sys
          print("Python:", sys.version)
          for name in ("homeassistant", "pytest-homeassistant-custom-component", "pytest", "pytest-asyncio", "black", "ruff"):
              print(f"{name}: {m.version(name)}")
          PY
          uv --version

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m compileall -q custom_components tests

      - name: Ruff validation
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync ruff check .

      - name: Black validation
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync black --check .

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m pytest -q
        env:
          PYTHONPATH: .

      - name: Build release ZIP (integration root at ZIP root)
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${{ github.workspace }}/airzoneclouddaikin.zip"
          git archive --format=zip --output="${{ github.workspace }}/airzoneclouddaikin.zip" HEAD:custom_components/airzoneclouddaikin

      - name: Validate ZIP structure (zip_release-compatible)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile

          zip_path = "airzoneclouddaikin.zip"
          required = {"manifest.json", "__init__.py", "translations/en.json"}

          with zipfile.ZipFile(zip_path) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]

          if not names:
              raise SystemExit("ZIP is empty")

          bad_prefix = [n for n in names if n.startswith("custom_components/")]
          if bad_prefix:
              raise SystemExit(
                  "ZIP contains 'custom_components/' prefix; "
                  "zip must be integration-root only"
              )

          generated = [
              n
              for n in names
              if "__pycache__/" in n
              or n.endswith((".pyc", ".pyo"))
              or n.startswith((".pytest_cache/", ".ruff_cache/"))
              or n == ".DS_Store"
              or n.endswith("/.DS_Store")
          ]
          if generated:
              raise SystemExit(
                  "ZIP contains generated/cache files: " + ", ".join(generated)
              )

          missing = sorted(required.difference(names))
          if missing:
              raise SystemExit("ZIP missing required root files: " + ", ".join(missing))

          print("ZIP structure validated.")
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: airzoneclouddaikin-zip
          path: airzoneclouddaikin.zip
