name: Package Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Build release ZIP (integration root at ZIP root)
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${{ github.workspace }}/airzoneclouddaikin.zip"
          git archive --format=zip --output="${{ github.workspace }}/airzoneclouddaikin.zip" HEAD:custom_components/airzoneclouddaikin

      - name: Validate installable Marketplace / HACS release asset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_marketplace_release.py airzoneclouddaikin.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: airzoneclouddaikin-zip
          path: airzoneclouddaikin.zip
          if-no-files-found: error
          retention-days: 7
